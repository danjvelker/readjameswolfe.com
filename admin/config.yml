backend:
  name: git-gateway
  repo: danjvelker/readjameswolfe.com
  branch: main
  identity_url: https://auth.decapbridge.com/sites/59da8a31-eeb0-4f65-8e6f-fae7f09f149a
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://readjameswolfe.com

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  # ------------------------------------------------------------
  # Articles: a real folder collection — this is the whole point
  # of Phase 3. Clicking "Articles" in the sidebar shows just a
  # clean list; "New Article" opens a dedicated full-screen editor
  # for that one article only.
  # ------------------------------------------------------------
  - name: "articles"
    label: "Articles"
    folder: "src/articles"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Used in the article's web address, e.g. readjameswolfe.com/this-part. Lowercase, words separated by hyphens, no spaces. This also becomes the filename, so it's best to set it once and not change it later."
      - { label: "Header Image", name: "image", widget: "image", hint: "Every article should have one — shown at the top of the article and in feed previews." }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "A short preview shown in the homepage feed and articles archive (2-3 sentences)." }
      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "Just pick the date — there's no time-of-day component."
      - label: "Author"
        name: "author"
        widget: "string"
        default: "James Wolfe"
        hint: "Must match a name from the Authors section exactly."
      - label: "Tags"
        name: "tags"
        widget: "list"
        hint: "Type tags separated by commas, e.g. Grace, Patience, Suffering."
      - label: "Show in Homepage Feed"
        name: "publishToHomepage"
        widget: "boolean"
        default: true
        hint: "On = appears in the homepage feed. Off = still visible on the Articles page, just not the homepage."
      - label: "Body"
        name: "body"
        widget: "markdown"
        buttons:
          [
            "bold",
            "italic",
            "link",
            "heading-one",
            "heading-two",
            "heading-three",
            "quote",
            "bulleted-list",
            "numbered-list",
          ]
        editor_components: ["scripture", "imageBlock", "youtubeEmbed"]
        hint: "Use the quote-mark button for a normal block quote, or the Scripture Quote / Image / YouTube blocks (in the '+' menu) for the special formats. Switch to the pencil icon for raw markdown mode to add a horizontal rule (type --- on its own line)."

  # ------------------------------------------------------------
  # About, Authors, Daily Quote Gallery, and Site Settings each
  # get their own dedicated section now, instead of being buried
  # inside one big shared form.
  # ------------------------------------------------------------
  - name: "about"
    label: "About Page"
    files:
      - file: "src/_data/about.json"
        label: "About Page"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Photo (optional)", name: "photo", widget: "image", required: false }
          - label: "Body"
            name: "body"
            widget: "markdown"
            buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]

  - name: "authors"
    label: "Authors"
    files:
      - file: "src/_data/authors.json"
        label: "Authors"
        name: "authorsFile"
        fields:
          - label: "Authors"
            name: "authors"
            widget: "list"
            summary: "{{name}}"
            hint: "Everyone who writes for the site, including guest writers. Add a new entry here before assigning a guest as an article's author."
            fields:
              - { label: "Name", name: "name", widget: "string", hint: "Type this exactly the same way when assigning an article's author — it's how the two get matched up." }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Photo (optional)", name: "photo", widget: "image", required: false }

  - name: "gallery"
    label: "Daily Quote Gallery"
    files:
      - file: "src/_data/gallery.json"
        label: "Daily Quote Gallery"
        name: "galleryFile"
        fields:
          - label: "Images"
            name: "gallery"
            widget: "list"
            summary: "{{fields.image}}"
            hint: "Upload quote graphics here. The sidebar shows one at random on each visit, with a button visitors can click to see the whole gallery."
            field: { label: "Image", name: "image", widget: "image" }

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/_data/settings.json"
        label: "Site Settings"
        name: "settingsFile"
        fields:
          - { label: "Header Tagline", name: "tagline", widget: "string", hint: "Shown under the site title in the header." }
          - { label: "Sidebar Welcome Blurb", name: "sidebarBlurb", widget: "text", hint: "The short 'Welcome...' note shown at the top of the sidebar on every page." }
          - { label: "Footer Subscribe Text", name: "footerSubscribeText", widget: "string" }
          - { label: "Copyright Line", name: "copyrightLine", widget: "string" }
          - { label: "Quotes Subdomain URL", name: "quotesUrl", widget: "string", hint: "Where the 'Quotes' nav link goes." }
          - { label: "Substack URL", name: "substackUrl", widget: "string" }
          - label: "Social Links"
            name: "socialLinks"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string" }
              - { label: "X", name: "x", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
