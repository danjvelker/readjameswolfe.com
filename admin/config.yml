# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: danjvelker/readjameswolfe.com
  branch: main
  identity_url: https://auth.decapbridge.com/sites/59da8a31-eeb0-4f65-8e6f-fae7f09f149a
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# Add site links in Decap CMS (optional)
site_url: https://readjameswolfe.com

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "content"
    label: "Site Content"
    files:
      - file: "content/site-content.json"
        label: "Articles, Authors, Quote Gallery & About"
        name: "site"
        fields:

          - label: "About Page"
            name: "about"
            widget: "object"
            summary: "About page"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Photo (optional)", name: "photo", widget: "image", required: false }
              - label: "Body"
                name: "body"
                widget: "markdown"
                buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]

          - label: "Authors"
            name: "authors"
            widget: "list"
            summary: "{{name}}"
            hint: "Everyone who writes for the site, including guest writers. Add a new entry here before assigning a guest as an article's author below."
            fields:
              - { label: "Name", name: "name", widget: "string", hint: "Type this exactly the same way when assigning an article's author below — it's how the two get matched up." }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Photo (optional)", name: "photo", widget: "image", required: false }

          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Slug"
                name: "slug"
                widget: "string"
                hint: "Used in the article's web address, e.g. readjameswolfe.com/this-part. Lowercase, words separated by hyphens, no spaces."
              - { label: "Header Image", name: "image", widget: "image", hint: "Every article should have one — shown at the top of the article and in feed previews." }
              - { label: "Excerpt", name: "excerpt", widget: "text", hint: "A short preview shown in the homepage feed and articles archive (2-3 sentences)." }
              - label: "Date"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                hint: "Just pick the date — there's no time-of-day component."
              - label: "Author"
                name: "author"
                widget: "string"
                default: "James Wolfe"
                hint: "Must match a name from the Authors list above exactly."
              - label: "Tags"
                name: "tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }
                hint: "Click 'Add' below to add each tag separately. Used for filtering on the Articles page."
              - label: "Show in Homepage Feed"
                name: "publishToHomepage"
                widget: "boolean"
                default: true
                hint: "On = appears in the homepage feed. Off = still visible on the Articles page, just not the homepage."
              - label: "Body"
                name: "body"
                widget: "markdown"
                buttons:
                  [
                    "bold",
                    "italic",
                    "link",
                    "heading-one",
                    "heading-two",
                    "heading-three",
                    "quote",
                    "bulleted-list",
                    "numbered-list",
                  ]
                editor_components: ["scripture", "imageBlock", "youtubeEmbed"]
                hint: "Use the quote-mark button for a normal block quote, or the Scripture Quote block (in the '+' menu) for styled Bible references. Switch to the pencil icon for raw markdown mode to add a horizontal rule (type --- on its own line)."

          - label: "Daily Quote Gallery"
            name: "dailyQuoteGallery"
            widget: "list"
            summary: "{{fields.image}}"
            hint: "Upload quote graphics here. The sidebar shows one at random on each visit, with a button visitors can click to see the whole gallery."
            field: { label: "Image", name: "image", widget: "image" }
