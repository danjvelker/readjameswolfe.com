# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: danjvelker/readjameswolfe.com
  branch: main
  identity_url: https://auth.decapbridge.com/sites/59da8a31-eeb0-4f65-8e6f-fae7f09f149a
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# Add site links in Decap CMS (optional)
site_url: https://readjameswolfe.netlify.app

# Where images uploaded through the CMS get saved in the repo, and the
# URL path used to reference them on the live site.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "content"
    label: "Site Content"
    files:
      - file: "content/site-content.json"
        label: "Articles, Quotes & About"
        name: "site"
        fields:

          - label: "About Page"
            name: "about"
            widget: "object"
            summary: "About page"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Photo (optional)", name: "photo", widget: "image", required: false }
              - label: "Body"
                name: "body"
                widget: "markdown"
                buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]

          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Slug"
                name: "slug"
                widget: "string"
                hint: "Used in the article's web address. Lowercase, words separated by hyphens, no spaces — e.g. on-the-patience-of-god"
              - { label: "Header Image", name: "image", widget: "image", hint: "Every article should have one — shown at the top of the article and in feed previews." }
              - { label: "Excerpt", name: "excerpt", widget: "text", hint: "A short preview shown in the homepage feed and articles archive (2-3 sentences)." }
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - label: "Tags"
                name: "tags"
                widget: "list"
                hint: "Used for filtering on the Articles page. Add as many as you like."
              - label: "Show in Homepage Feed"
                name: "publishToHomepage"
                widget: "boolean"
                default: true
                hint: "On = appears in the homepage feed. Off = still visible on the Articles page, just not the homepage."
              - label: "Clicks"
                name: "clicks"
                widget: "number"
                default: 0
                value_type: "int"
                hint: "Powers the sidebar's Trending list. Leave at 0 for new articles — real click tracking is a future upgrade."
              - label: "Body"
                name: "body"
                widget: "markdown"
                buttons:
                  [
                    "bold",
                    "italic",
                    "link",
                    "heading-one",
                    "heading-two",
                    "heading-three",
                    "quote",
                    "bulleted-list",
                    "numbered-list",
                  ]
                editor_components: ["scripture"]
                hint: "Use the quote-mark button for a normal block quote, or the Scripture Quote block (in the '+' menu) for styled Bible references. Switch to the pencil icon for raw markdown mode to add a horizontal rule (type --- on its own line)."

          - label: "Quotes"
            name: "quotes"
            widget: "list"
            summary: "{{author}}"
            fields:
              - label: "ID"
                name: "id"
                widget: "string"
                hint: "Unique, no spaces — e.g. q11"
              - { label: "Quote Text", name: "text", widget: "text" }
              - { label: "Author", name: "author", widget: "string" }
              - label: "Tags"
                name: "tags"
                widget: "list"
                hint: "Used for filtering on the Quotes page."
              - { label: "Quote Image (optional)", name: "image", widget: "image", required: false }
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - label: "Show in Homepage Feed"
                name: "publishToHomepage"
                widget: "boolean"
                default: false
              - label: "Clicks"
                name: "clicks"
                widget: "number"
                default: 0
                value_type: "int"
